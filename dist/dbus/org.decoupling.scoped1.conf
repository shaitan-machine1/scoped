<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  Bus policy for scoped. Install as
  /usr/share/dbus-1/system.d/org.decoupling.scoped1.conf

  The system bus denies owning any name by default (`<deny own="*"/>` in
  system.conf), so without this file scoped cannot take its name even as
  root.

  Note that every method call is deliberately allowed through to scoped
  from any uid: scoped does its own authorization on the caller's uid,
  which it reads from the bus daemon's credentials for the sending
  connection (root may address anything; uid N may only address
  `user/<N>/...` and only move processes it owns). Doing it there rather
  than here is what lets an unprivileged caller manage its own scopes
  without a bus-policy change per user.
-->

<busconfig>

        <policy user="root">
                <!-- own_prefix also covers org.decoupling.scoped1.* , which
                     the e2e tests use to run throwaway instances side by
                     side with a real one. -->
                <allow own_prefix="org.decoupling.scoped1"/>
                <allow send_destination="org.decoupling.scoped1"/>
                <allow receive_sender="org.decoupling.scoped1"/>
        </policy>

        <policy context="default">
                <allow send_destination="org.decoupling.scoped1"/>
                <allow receive_sender="org.decoupling.scoped1"/>
        </policy>

</busconfig>
