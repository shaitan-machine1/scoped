<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  Install as:
    /usr/share/dbus-1/system.d/org.decoupling.scoped1.conf

  Phase 1 scoped is root-only. The bus policy rejects unprivileged traffic as
  defense in depth; scoped independently checks the caller UID on every method
  and remains the authorization boundary.
-->

<busconfig>
        <policy user="root">
                <allow own="org.decoupling.scoped1"/>
                <allow send_destination="org.decoupling.scoped1"/>
                <allow receive_sender="org.decoupling.scoped1"/>
        </policy>

        <policy context="default">
                <deny send_destination="org.decoupling.scoped1"/>
                <deny receive_sender="org.decoupling.scoped1"/>
        </policy>
</busconfig>
